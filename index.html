<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наша свадьба</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="hero">
        <div class="overlay">
            <h1>Дмитрий & Марина</h1>
            <p>Мы рады пригласить вас на нашу свадьбу</p>

            <button id="openInvitation">
                Открыть приглашение
            </button>
        </div>
    </section>

    <section class="invitation hidden" id="invitation">
        <h2 id="guestName">Дорогие гости</h2>

        <p>
            С огромной радостью приглашаем вас
            разделить с нами самый важный день
            нашей жизни.
        </p>

        <p>
            18 июля 2027 года
        </p>
    </section>

    <script src="script.js"></script>

</body>
</html>
