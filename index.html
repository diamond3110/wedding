<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Наша свадьба</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="hero">
        <div class="overlay">
            <h1>Дмитрий & Марина</h1>
            <p>Мы рады пригласить вас на нашу свадьбу</p>

            <button id="openInvitation">
                Открыть приглашение
            </button>
        </div>
    </section>

    <section class="invitation hidden" id="invitation">
        <h2 id="guestName" class="guest-name">Дорогие гости</h2>
        <p> С огромной радостью приглашаем вас
            разделить с нами самый важный день
            нашей жизни!
        </p>

        <div class="wedding-date-section">

            <h2>До нашей свадьбы осталось</h2>

            <div class="countdown">

                <div class="countdown-card">
                    <span id="days">0</span>
                    <p>дней</p>
                </div>

                <div class="countdown-card">
                    <span id="hours">0</span>
                    <p>часов</p>
                </div>

                <div class="countdown-card">
                    <span id="minutes">0</span>
                    <p>минут</p>
                </div>

                <div class="countdown-card">
                    <span id="seconds">0</span>
                    <p>секунд</p>
                </div>

            </div>

            <div class="wedding-info">
                <h3>18 июля 2027</h3>
                <p>16:00</p>
            </div>

        </div>
    </section>

    

    <script src="script.js"></script>

</body>
</html>
